name: Feature request
description: Propose a focused improvement with a clear user benefit.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What user problem or workflow is currently difficult?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the smallest useful improvement.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and acceptance criteria
      description: How could the result be inspected or verified?
    validations:
      required: true
  - type: checkboxes
    id: boundaries
    attributes:
      label: Product boundaries
      options:
        - label: This proposal distinguishes implemented functionality from roadmap intent.
          required: true
        - label: Any AI or automation behavior should remain reviewable and human-directed.
          required: false
