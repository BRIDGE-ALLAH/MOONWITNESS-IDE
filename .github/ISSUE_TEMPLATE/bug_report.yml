name: Bug report
description: Report a reproducible problem in MOONWITNESS IDE.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Please check for existing reports first. Do not include passwords, access tokens, private keys, or personal data."
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: App version, release tag, or full commit SHA.
      placeholder: "commit SHA / version"
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Provide the smallest reliable sequence.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Redact secrets and personal information. Include exact error text where possible.
    validations:
      required: false
